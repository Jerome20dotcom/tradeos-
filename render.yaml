services:
  - type: web
    name: tradeos
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: python scripts/setup_db.py
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PG_APP_USER
        value: tradeos_app
      - key: DB_NAME
        value: tradeos
      - key: DATABASE_URL
        fromDatabase:
          name: tradeos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        sync: false
      - key: COPILOT_API_KEY
        sync: false
      - key: COPILOT_BASE_URL
        value: https://api.openai.com/v1
      - key: COPILOT_MODEL
        value: gpt-4o-mini

databases:
  - name: tradeos-db
    databaseName: tradeos
    user: tradeos_app
    plan: basic-256mb
    region: oregon
